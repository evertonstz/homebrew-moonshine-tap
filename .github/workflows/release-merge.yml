name: Moonshine protected release merge

'on':
  workflow_run:
    workflows: [Moonshine CI]
    types: [completed]

permissions:
  contents: read

# Share the detection and publication lock. Do not cancel jobs that hold credentials.
concurrency:
  group: moonshine-release-update
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'evertonstz/homebrew-moonshine-tap' &&
      (vars.MOONSHINE_RELEASE_UPDATES_ENABLED == 'true' || vars.MOONSHINE_STABLE_PROMOTION_ENABLED == 'true') &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'automation/moonshine-release' &&
      github.event.workflow_run.head_repository.full_name == 'evertonstz/homebrew-moonshine-tap'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current trusted main, never the PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Ruby for the trusted controller
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.6'
      - name: Check actual CI, exact patch, head and current-base protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOONSHINE_PROTECTION_TOKEN: ${{ secrets.MOONSHINE_PROTECTION_TOKEN }}
          MOONSHINE_RELEASE_UPDATES_ENABLED: ${{ vars.MOONSHINE_RELEASE_UPDATES_ENABLED }}
          MOONSHINE_STABLE_PROMOTION_ENABLED: ${{ vars.MOONSHINE_STABLE_PROMOTION_ENABLED }}
          MOONSHINE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: ruby --disable=rubyopt tools/github_release.rb merge
